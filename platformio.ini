[env:waveshare_lcd_7]
platform = espressif32@7.0.1
board = esp32-s3-devkitc-1
framework = espidf

; LVGL is registered as an ESP-IDF component in the root CMakeLists.txt.
; Keep lib_deps for installation; avoid compiling the same library via LDF.
lib_ignore = lvgl

monitor_speed = 115200
upload_speed = 460800

; The 8 MB layout works with both N8R8 and N16R8 revisions of this board.
board_upload.flash_size = 8MB
board_build.partitions = partitions.csv

build_flags =
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_LVGL_H_INCLUDE_SIMPLE
    -DLV_KCONFIG_IGNORE
    -I include
    -I src/UI

lib_deps =
    lvgl/lvgl@9.5.0
